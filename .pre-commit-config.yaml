# Pre-commit hooks for code quality and consistency
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# To run all hooks manually:
#   pre-commit run --all-files
#
# To run tests (manual stage):
#   pre-commit run --hook-stage test pytest

default_stages: [commit]
fail_fast: false
repos:
  # General file fixes and checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # Latest stable version as of Dec 2024
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']

  # Python code formatting with Black (optional but recommended)
  - repo: https://github.com/psf/black
    rev: 24.10.0  # Latest stable version as of Dec 2024
    hooks:
      - id: black
        name: Format code with Black
        language_version: python3.10
        args: ['--line-length=100']

  # Import sorting with isort (optional, complementary to ruff)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2  # Latest stable version as of Dec 2024
    hooks:
      - id: isort
        name: Sort imports with isort
        args: ['--profile=black', '--line-length=100']

  # Ruff - Fast Python linter (primary linter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5  # Latest stable version as of Dec 2024
    hooks:
      - id: ruff
        name: Lint with ruff
        args: ['--fix', '--exit-non-zero-on-fix']
        types: [python]

  # Security checks with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10  # Latest stable version as of Dec 2024
    hooks:
      - id: bandit
        name: Security check with Bandit
        args: ['-ll', '--skip=B101']  # Skip assert_used test
        files: ^src/
        exclude: ^tests/

  # Local hooks that use Poetry
  - repo: local
    hooks:
      # Type checking with mypy
      - id: mypy
        name: Type check with mypy
        entry: poetry run mypy
        language: system
        types: [python]
        files: ^(src|tests)/
        args: ['src', 'tests']
        pass_filenames: false
        require_serial: true

      # Check Poetry lock file is up to date
      - id: poetry-check
        name: Check Poetry configuration
        entry: poetry check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock)$

      # Export requirements (optional, useful for compatibility)
      - id: poetry-export
        name: Export requirements.txt
        entry: poetry export -f requirements.txt --output requirements.txt --without-hashes
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock)$

      # Run tests (manual stage - not on every commit)
      - id: pytest
        name: Run tests with pytest
        entry: poetry run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [test]
        verbose: true
        args: ['--tb=short', '-q']

      # Quick test run (optional - for critical tests only)
      - id: pytest-quick
        name: Run quick tests
        entry: poetry run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [push]
        args: ['-m', 'not slow', '--tb=short', '-q']

# Configuration for specific hooks
exclude: |
  (?x)^(
    .*\.egg-info/.*|
    \.git/.*|
    \.mypy_cache/.*|
    \.pytest_cache/.*|
    \.ruff_cache/.*|
    \.venv/.*|
    build/.*|
    dist/.*|
    __pycache__/.*
  )$