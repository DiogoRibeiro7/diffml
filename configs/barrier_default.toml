# Default configuration for barrier option experiment (down-and-out call)

[experiment]
name = "barrier"
seed = 42

[training]
n_epochs = 2000
batch_size = 256
lr_initial = 1e-3
lr_min = 1e-6
lambda_delta = 1.0  # Weight for delta regularization
lambda_gamma = 0.0  # No gamma regularization

[dataset]
m_train = 1024      # Number of training samples
m_test = 256        # Number of test samples
n_paths_train = 10000   # MC paths for training
n_paths_test = 50000    # MC paths for testing
x_min = 0.85        # Min spot as fraction of K (above barrier)
x_max = 1.5         # Max spot as fraction of K

[payoff]
K = 1.0             # Strike price (normalized)
B = 0.85            # Barrier level (down-and-out)

[black_scholes]
r = 0.0             # Risk-free rate
sigma = 0.2         # Volatility
T = 0.3333          # Time to maturity (4 months)