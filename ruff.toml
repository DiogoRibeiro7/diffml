# Ruff configuration for DiffML Article Replication

line-length = 100
target-version = "py310"

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
    "NPY",   # NumPy-specific rules
    "PD",    # pandas-vet
    "RUF",   # Ruff-specific rules
    "N",     # pep8-naming
    "D",     # pydocstyle
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "C901",   # Too complex
    "D203",   # 1 blank line required before class docstring (conflicts with D211)
    "D211",   # No blank lines allowed before class docstring (conflicts with D203)
    "D213",   # Multi-line docstring summary should start at the second line
    "D401",   # First line should be in imperative mood
    "ARG002", # Unused method argument
    "SIM108", # Use ternary operator (sometimes less readable)
    "N803",   # Allow domain-specific uppercase argument names
    "N806",   # Allow uppercase variables inside functions
    "NPY002", # Allow legacy numpy seeding for reproducibility
    "RUF022", # Preserve curated __all__ ordering
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "ARG002", "D", "S101"]

[lint.pydocstyle]
convention = "numpy"

[lint.isort]
known-first-party = ["diffml"]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
