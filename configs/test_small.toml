# Small test configuration for quick testing

[experiment]
name = "digital"
seed = 123

[training]
n_epochs = 10      # Very few epochs for quick test
batch_size = 32
lr_initial = 1e-3
lr_min = 1e-6
lambda_delta = 1.0

[dataset]
m_train = 50       # Small dataset for testing
m_test = 20
n_paths_train = 100
n_paths_test = 500
x_min = 0.8
x_max = 1.2

[payoff]
K = 1.0

[black_scholes]
r = 0.0
sigma = 0.2
T = 0.25