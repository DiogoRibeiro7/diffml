[tool.poetry]
name = "diffml"
version = "0.1.0"
description = "Replication of experiments from 'Differential ML with a Difference' (Paul Glasserman & Siddharth Hemant Karmarkar)"
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
readme = "README.md"
license = "MIT"
packages = [
    {include = "diffml", from = "src"},
    {include = "diffml_article_replication", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.0.0"
numpy = "^1.24.0"
scipy = "^1.10.0"
matplotlib = "^3.7.0"
pandas = "^2.0.0"
tqdm = "^4.65.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
mypy = "^1.5.0"
ruff = "^0.1.0"
pytest-cov = "^4.1.0"
ipykernel = "^6.25.0"
notebook = "^7.0.0"
types-toml = "^0.10.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
strict_equality = true
