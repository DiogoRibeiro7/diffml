[metadata]
name = diffml
version = attr: diffml.__version__
author = DiogoRibeiro7
author_email = diogo.ribeiro@example.com
description = Differential Machine Learning for Quantitative Finance
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/DiogoRibeiro7/diffml
project_urls =
    Bug Tracker = https://github.com/DiogoRibeiro7/diffml/issues
    Documentation = https://diffml.readthedocs.io
    Source Code = https://github.com/DiogoRibeiro7/diffml
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Financial and Insurance Industry
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Office/Business :: Financial
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True
zip_safe = False

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    diffml = diffml.cli:main
    diffml-dashboard = diffml.dashboard_cli:main

[bdist_wheel]
universal = False

[egg_info]
tag_build =
tag_date = 0

[aliases]
test = pytest

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=diffml
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

[coverage:run]
source = diffml
omit =
    */tests/*
    */test_*.py
    */__init__.py
    */setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_any_generics = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True

[mypy-tests.*]
ignore_errors = True

[isort]
profile = black
line_length = 88
known_first_party = diffml
skip_gitignore = True

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,docs/source/conf.py,old,build,dist

[black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/'''