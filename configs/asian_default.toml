# Default configuration for arithmetic Asian call option experiment

[experiment]
name = "asian"
seed = 42

[training]
n_epochs = 1500
batch_size = 128
lr_initial = 1e-3
lr_min = 1e-6
lambda_delta = 0.5  # Moderate delta regularization

[dataset]
m_train = 512       # Number of training samples
m_test = 128        # Number of test samples
n_paths_train = 500     # MC paths per spot for training
n_paths_test = 2000     # MC paths per spot for testing
x_min = 0.7         # Min spot as fraction of K
x_max = 1.3         # Max spot as fraction of K

[payoff]
K = 100.0           # Strike price
n_steps = 16        # Time discretization steps

[black_scholes]
r = 0.05            # Risk-free rate
sigma = 0.3         # Volatility
T = 0.5             # Time to maturity (6 months)